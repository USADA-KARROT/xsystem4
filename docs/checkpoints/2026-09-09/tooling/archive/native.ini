[binaries]
c = '/Library/Developer/CommandLineTools/usr/bin/clang'
cpp = '/Library/Developer/CommandLineTools/usr/bin/clang++'
bison = '/opt/homebrew/opt/bison/bin/bison'
flex = '/opt/homebrew/opt/flex/bin/flex'
pkg-config = '/opt/homebrew/bin/pkg-config'

[built-in options]
c_args = ['-isysroot', '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk']
cpp_args = ['-isysroot', '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk']
c_link_args = ['-isysroot', '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk']
cpp_link_args = ['-isysroot', '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk']
